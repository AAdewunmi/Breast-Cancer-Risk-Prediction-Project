{% extends "base.html" %}

{% block content %}
<div class="row">
  <div class="col-lg-8">
    <div class="card shadow-sm p-4">
      <h4>Provide Data</h4>

      <form method="post" enctype="multipart/form-data" action="{{ url_for('predictor.predict') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Age</label>
          <input class="form-control" name="age" type="number" min="0" />
        </div>

        <div class="mb-3">
          <label class="form-label">BMI</label>
          <input class="form-control" name="bmi" type="number" step="0.1" />
        </div>

        <div class="mb-3">
          <label class="form-label">Alcohol (units/week)</label>
          <input class="form-control" name="alcohol" type="number" />
        </div>

        <div class="mb-3">
          <label class="form-label">Activity (minutes/week)</label>
          <input class="form-control" name="activity" type="number" />
        </div>

        <div class="mb-3">
          <label class="form-label">BRCA1</label>
          <select class="form-select" name="brca1">
            <option>No</option>
            <option>Yes</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">BRCA2</label>
          <select class="form-select" name="brca2">
            <option>No</option>
            <option>Yes</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Image (optional)</label>
          <input class="form-control" name="image" type="file" accept="image/*" />
        </div>

        <button class="btn btn-primary" type="submit" name="submit" value="1">Run prediction</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
