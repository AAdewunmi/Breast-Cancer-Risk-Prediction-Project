{# Simple two-column form page using Bootstrap #}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Provide Data — Breast Cancer Risk</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-..."
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('predictor.static', filename='css/app.css') }}" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand fs-3" href="{{ url_for('predictor.index') }}">Breast Cancer Risk</a>
      </div>
    </nav>

    <main class="container mb-5">
      <h3>Provide Data</h3>
      <form method="post" enctype="multipart/form-data" action="{{ url_for('predictor.predict') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
          <div class="col-lg-8">
            <div class="card shadow-sm p-4">
              <h5>Risk factors</h5>

              <div class="mb-3">
                <label class="form-label">Age</label>
                <input name="age" class="form-control" type="number" placeholder="e.g. 45" />
              </div>

              <div class="mb-3">
                <label class="form-label">BMI</label>
                <input name="bmi" class="form-control" type="number" step="0.1" placeholder="e.g. 24.5" />
              </div>

              <div class="mb-3">
                <label class="form-label">Alcohol (units/week)</label>
                <input name="alcohol" class="form-control" type="number" step="0.1" />
              </div>

              <div class="mb-3">
                <label class="form-label">Physical activity (score)</label>
                <input name="activity" class="form-control" type="number" />
              </div>

              <div class="mb-3">
                <label class="form-label">BRCA1</label>
                <select name="brca1" class="form-select">
                  <option>No</option>
                  <option>Yes</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">BRCA2</label>
                <select name="brca2" class="form-select">
                  <option>No</option>
                  <option>Yes</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Image (optional)</label>
                <input class="form-control" type="file" name="image" accept="image/*" />
              </div>

              <div class="mt-3">
                <button class="btn btn-primary" type="submit" name="submit" value="1">Predict</button>
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card shadow-sm p-4">
              <h5>Help</h5>
              <p class="small text-muted">Provide either an image, risk factors, or both. The app will combine the signals.</p>
            </div>
          </div>
        </div>
      </form>
    </main>

    <footer class="text-muted py-4 bg-white border-top">
      <div class="container">
        <small>Prototype only — not for clinical use.</small>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-..."
      crossorigin="anonymous"
    ></script>
    <script src="{{ url_for('predictor.static', filename='js/app.js') }}"></script>
  </body>
</html>
