repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: pytest
        name: Run tests with pytest
        entry: pytest
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies:
          - pytest
          - flask
          - flask_wtf
          # Add other dependencies here if needed, e.g.:
          # - numpy
          # - pandas
          # - sqlalchemy


  
