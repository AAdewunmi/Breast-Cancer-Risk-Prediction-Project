name: CI — Flask App Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      # Step 1 — Check out code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Step 2 — Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Step 3 — Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov Flask-WTF Flask-Bootstrap faker

      # Step 4 — Run tests with coverage
      - name: Run pytest
        run: |
          pytest -q --cov=predictor --cov-report=term-missing

      # Step 5 — Upload coverage report to GitHub summary
      - name: Upload coverage summary
        if: success() || failure()
        run: |
          echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          pytest --cov=predictor --cov-report=term-missing | tee -a $GITHUB_STEP_SUMMARY
