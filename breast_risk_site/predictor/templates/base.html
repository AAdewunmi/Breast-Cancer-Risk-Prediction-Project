{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Breast Cancer Risk{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link href="{% static 'predictor/app.css' %}" rel="stylesheet">
    {% block head_extra %}{% endblock %}
    <style>
      body { background-color:#f8f9fa; }
      .page-wrap { padding: 2rem 0 3rem; }
      .card { border-radius:.75rem; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-light bg-white border-bottom">
      <div class="container">
        <span class="navbar-brand fw-semibold">Breast Cancer Risk</span>
      </div>
    </nav>

    <main class="page-wrap">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer class="border-top py-3 bg-white">
      <div class="container text-muted small">
        Prototype only — not for clinical use.
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="{% static 'predictor/app.js' %}"></script>
    {% block body_extra %}{% endblock %}
  </body>
</html>
